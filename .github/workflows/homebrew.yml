name: Homebrew

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      TAP_DEPLOY_KEY:
        required: true

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: willsawyerrrr/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - name: Point the formula at this release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i -E \
            -e "s|^  url .*|  url \"${url}\"|" \
            -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
            Formula/tether.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: Update tether to ${TAG}"
          git push
