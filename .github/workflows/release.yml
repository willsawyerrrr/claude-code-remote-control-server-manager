name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the next version
        id: version
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          if [[ "$(git log -1 --format=%s)" == feat* ]]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
